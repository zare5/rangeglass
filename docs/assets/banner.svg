<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Rangeglass — Will this download resume?</title>
  <desc id="desc">A lightweight HTTP range diagnostic. Check the bytes before the gigabytes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1c2d"/><stop offset="1" stop-color="#101521"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="56" y="50" width="34" height="34" rx="9" fill="#9fefd0"/>
    <path d="M65 61h13v8H65zM76 69l6 7" fill="none" stroke="#0e1c2d" stroke-width="3"/>
    <text x="105" y="74" font-size="14" letter-spacing="3" fill="#9fefd0">HTTP RANGE DIAGNOSTICS</text>
    <text x="54" y="167" font-size="72" font-weight="700" letter-spacing="-3" fill="#f0f6fc">Rangeglass</text>
    <text x="57" y="221" font-size="28" fill="#e1e8f1">Will this download resume?</text>
    <text x="57" y="262" font-size="19" fill="#95a6bc">Check the bytes before the gigabytes.</text>
    <rect x="57" y="308" width="480" height="9" rx="4.5" fill="#263448"/>
    <rect x="57" y="308" width="72" height="9" rx="4.5" fill="#9fefd0"/>
    <rect x="260" y="308" width="60" height="9" rx="4.5" fill="#9fefd0"/>
    <rect x="465" y="308" width="72" height="9" rx="4.5" fill="#9fefd0"/>
    <text x="57" y="347" font-size="13" fill="#95a6bc" letter-spacing="1">SMALL READS</text>
    <text x="260" y="347" font-size="13" fill="#95a6bc" letter-spacing="1">REAL CHECKS</text>
    <text x="447" y="347" font-size="13" fill="#95a6bc" letter-spacing="1">CLEAR REPORTS</text>
  </g>
  <rect x="630" y="49" width="596" height="322" rx="13" fill="#0a111b" stroke="#2b3b50"/>
  <path d="M630 92h596" stroke="#2b3b50"/>
  <circle cx="652" cy="71" r="4" fill="#e88989"/><circle cx="669" cy="71" r="4" fill="#e6bd7e"/><circle cx="686" cy="71" r="4" fill="#9fefd0"/>
  <g font-family="Consolas,Menlo,monospace" font-size="17">
    <text x="1075" y="76" font-size="12" letter-spacing="2" fill="#8094ad">LOCAL DEMO</text>
    <text x="658" y="128" fill="#eef4fc">$ rangeglass --demo broken</text>
    <text x="658" y="169" fill="#f3b38c">FAIL  wrong_range</text>
    <text x="658" y="210" fill="#8196b1">Requested</text><text x="810" y="210" fill="#eef4fc">bytes 512-1535</text>
    <text x="658" y="240" fill="#8196b1">Received</text><text x="810" y="240" fill="#f3b38c">bytes 0-1023</text>
    <path d="M658 263h540" stroke="#263448"/>
    <text x="658" y="296" font-size="15" fill="#9fefd0">Check CDN cache keys and Range forwarding.</text>
    <text x="658" y="339" font-size="13" fill="#8196b1">tiny reads / clear checks / zero dependencies</text>
  </g>
</svg>
