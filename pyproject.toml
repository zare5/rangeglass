[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rangeglass"
version = "0.2.0"
description = "HTTP Range and download resume checker for CDN and proxy diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "zare5"}]
keywords = ["http", "http-range", "download-resume", "cdn", "proxy", "diagnostics", "etag", "if-range", "content-range", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
rangeglass = "rangeglass.cli:main"

[project.urls]
Homepage = "https://github.com/zare5/rangeglass"
Issues = "https://github.com/zare5/rangeglass/issues"
Documentation = "https://github.com/zare5/rangeglass#readme"

[tool.setuptools]
packages = ["rangeglass"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
